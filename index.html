<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#102a23" />
  <title>LOST CIVILIZATION - Mini Demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">BROWSER PROTOTYPE</p>
        <h1>LOST CIVILIZATION</h1>
        <p class="subtitle">ゼロから文明をつくれ ― Mini Demo</p>
      </div>
      <div class="level"><span>文明LEVEL</span><strong id="level">0</strong></div>
    </header>

    <section class="status-panel" aria-label="ゲーム状況">
      <div class="mission">
        <span class="label">MISSION</span>
        <strong id="missionText">まずは木と石を集めよう</strong>
      </div>
      <div class="inventory" id="inventory"></div>
    </section>

    <section class="game-shell">
      <div class="map-wrap">
        <div id="map" class="map" role="application" aria-label="探索マップ"></div>
        <div id="toast" class="toast" aria-live="polite"></div>
      </div>

      <aside class="side-panel">
        <section class="craft-card">
          <div class="card-title"><span>🔧</span><strong>CRAFT</strong></div>
          <button class="craft" data-craft="fire">
            <span class="craft-icon">🔥</span>
            <span><b>たき火</b><small>木×2 / 石×1</small></span>
          </button>
          <button class="craft" data-craft="furnace" disabled>
            <span class="craft-icon">🧱</span>
            <span><b>簡易炉</b><small>石×2 / 木×1</small></span>
          </button>
          <button class="craft" data-craft="glass" disabled>
            <span class="craft-icon">🪟</span>
            <span><b>ガラス</b><small>砂×2 / 木×1</small></span>
          </button>
        </section>

        <section class="log-card">
          <div class="card-title"><span>📓</span><strong>DISCOVERY LOG</strong></div>
          <ol id="log"></ol>
        </section>
      </aside>
    </section>

    <section class="controls" aria-label="移動操作">
      <p><b>移動：</b> 画面の矢印 / キーボードの矢印・WASD</p>
      <div class="dpad">
        <button data-move="up" aria-label="上へ">▲</button>
        <button data-move="left" aria-label="左へ">◀</button>
        <button data-move="down" aria-label="下へ">▼</button>
        <button data-move="right" aria-label="右へ">▶</button>
      </div>
      <button id="reset" class="reset">最初から</button>
    </section>
  </main>

  <dialog id="clearDialog">
    <div class="clear-box">
      <p class="eyebrow">DEMO CLEAR</p>
      <div class="clear-icon">✨🪟✨</div>
      <h2>文明LEVEL 1 達成！</h2>
      <p>火を起こし、炉をつくり、砂からガラスを生み出した。</p>
      <p class="next">次の文明では「銅」「電気」「通信」へ。</p>
      <button id="playAgain">もう一度遊ぶ</button>
    </div>
  </dialog>

  <script src="game.js"></script>
</body>
</html>
