<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102a23"><title>LOST CIVILIZATION</title><link rel="stylesheet" href="styles.css?v=20260816-7"></head><body>
<section id="titleScreen" class="title-screen"><div class="title-card"><a href="../" class="back-link">← ゲーム一覧</a><p class="eyebrow">EXPLORE · DISCOVER · BUILD</p><h1>LOST<br>CIVILIZATION</h1><p class="title-copy">自然を越えて、文明をつくれ。</p><div class="mode-label">プレイモードをえらぼう</div><button class="mode-btn solo" data-mode="com"><span class="mode-icon">🧍</span><span><strong>1人プレイ</strong><small>COMと文明レース</small></span><b>›</b></button><button class="mode-btn versus" data-mode="pvp"><span class="mode-icon">🧍🧍</span><span><strong>2人プレイ</strong><small>1台で交互に対戦</small></span><b>›</b></button></div></section>
<main id="gameApp" class="app game-hidden"><header class="hero"><div><button id="backToTitle" class="text-btn">← モード選択</button><p class="eyebrow">CIVILIZATION RACE</p><h1>LOST CIVILIZATION</h1></div><button id="reset" class="reset">新しい地形</button></header>
<section class="turnbar"><div id="p1Card" class="player-card active"><span class="human-mini red"></span><div><b>PLAYER 1</b><small id="p1Inv">木0 石0 砂0</small></div></div><div class="turn-name"><strong id="turnText">PLAYER 1 の番</strong><small id="moveLeft"></small></div><div id="p2Card" class="player-card"><span class="human-mini blue"></span><div><b id="p2Name">COM</b><small id="p2Inv">木0 石0 砂0</small></div></div></section>
<section class="game-shell"><div class="board-shell" id="boardShell"><div class="map-actions"><button id="overviewBtn" class="map-btn">🗺️</button></div><div class="camera-label" id="cameraLabel">📍 PLAYER 1</div><div class="tech-strip"><div class="tech-chip" id="techFire">🔥<small>2🪵1🪨</small></div><div class="tech-chip" id="techBoat">🛶<small>4🪵+🔥</small></div><div class="tech-chip" id="techGoal">⭐</div></div><div id="board" class="board"></div><div id="toast" class="toast"></div><button id="diceBtn" class="board-die" aria-label="サイコロを振る"><span class="dice-cube"><span id="diceValue" class="dice-number">-</span></span></button><div class="pan-hint">↔ 地図をドラッグ</div></div></section></main>
<dialog id="winDialog"><div class="clear-box"><p class="eyebrow">CIVILIZATION WIN</p><div class="clear-icon">🏆🌍✨</div><h2 id="winnerText">PLAYER 1 勝利！</h2><p>自然を越えて、新しい文明の土地へ到達した。</p><button id="playAgain">もう一度</button></div></dialog>
<script src="game.js?v=20260816-7"></script></body></html>
