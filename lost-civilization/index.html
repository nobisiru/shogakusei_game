<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#102a23"><title>LOST CIVILIZATION 3D</title><link rel="stylesheet" href="styles.css?v=20260816-three2"></head><body>
<section id="titleScreen" class="title-screen"><div class="title-card"><a href="../" class="back-link">← ゲーム一覧</a><p class="eyebrow">3D CIVILIZATION ADVENTURE</p><h1>LOST<br>CIVILIZATION</h1><p class="title-copy">自然を越えて、文明をつくれ。</p><div class="mode-label">プレイモード</div><button class="mode-btn solo" data-mode="com"><span class="mode-icon">🧍</span><span><strong>1人プレイ</strong><small>COMと文明レース</small></span><b>›</b></button><button class="mode-btn versus" data-mode="pvp"><span class="mode-icon">🧍🧍</span><span><strong>2人プレイ</strong><small>1台で交互に対戦</small></span><b>›</b></button></div></section>
<main id="gameApp" class="app game-hidden"><header class="hero"><div><button id="backToTitle" class="text-btn">← モード選択</button><h1>LOST CIVILIZATION</h1></div><button id="reset" class="reset">新しい地形</button></header>
<section class="turnbar"><div id="p1Card" class="player-card active"><span class="human-mini red"></span><div><b>PLAYER 1</b><small id="p1Inv">🪵0 🪨0</small></div></div><div class="turn-name"><strong id="turnText">PLAYER 1</strong></div><div id="p2Card" class="player-card"><span class="human-mini blue"></span><div><b id="p2Name">COM</b><small id="p2Inv">🪵0 🪨0</small></div></div></section>
<section class="game-shell"><div class="world" id="world"><canvas id="game3d"></canvas><div class="top-tools"><span id="cameraLabel" class="camera-label">📍 PLAYER 1</span><button id="overviewBtn" class="round-btn" aria-label="全体マップ">🗺️</button></div><div class="bottom-hud"><button id="diceBtn" class="dice-trigger" aria-label="サイコロを振る">🎲</button><div class="mission-hud"><span>MISSION</span><strong id="missionNow">🔥 火を起こせ</strong><small id="missionNeed">木 2　石 1</small></div></div><div id="toast" class="toast"></div><div id="loading" class="loading">3D WORLD LOADING…</div><div id="webglError" class="webgl-error hidden">この端末では3D表示を開始できませんでした。</div></div></section></main>
<dialog id="winDialog"><div class="clear-box"><p class="eyebrow">CIVILIZATION WIN</p><div class="clear-icon">🏆🌍✨</div><h2 id="winnerText">PLAYER 1 勝利！</h2><p>自然を越えて、新しい文明の土地へ到達した。</p><button id="playAgain">もう一度</button></div></dialog>
<script type="module" src="game3d-v2.js?v=20260816-three2"></script></body></html>
