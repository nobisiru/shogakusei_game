<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102a23"><title>LOST CIVILIZATION</title><link rel="stylesheet" href="styles.css?v=20260816-8"></head><body>
<section id="titleScreen" class="title-screen"><div class="title-card"><a href="../" class="back-link">← ゲーム一覧</a><p class="eyebrow">EXPLORE · DISCOVER · BUILD</p><h1>LOST<br>CIVILIZATION</h1><p class="title-copy">自然を越えて、文明をつくれ。</p><div class="mode-label">プレイモードをえらぼう</div><button class="mode-btn solo" data-mode="com"><span class="mode-icon">🧍</span><span><strong>1人プレイ</strong><small>COMと文明レース</small></span><b>›</b></button><button class="mode-btn versus" data-mode="pvp"><span class="mode-icon">🧍🧍</span><span><strong>2人プレイ</strong><small>1台で交互に対戦</small></span><b>›</b></button></div></section>
<main id="gameApp" class="app game-hidden"><header class="hero"><div><button id="backToTitle" class="text-btn">← モード選択</button><p class="eyebrow">CIVILIZATION RACE</p><h1>LOST CIVILIZATION</h1></div><button id="reset" class="reset">新しい地形</button></header>
<section class="turnbar"><div id="p1Card" class="player-card active"><span class="human-mini red"></span><div><b>PLAYER 1</b><small id="p1Inv">木0 石0 砂0</small></div></div><div class="turn-name"><strong id="turnText">PLAYER 1 の番</strong><small id="moveLeft"></small></div><div id="p2Card" class="player-card"><span class="human-mini blue"></span><div><b id="p2Name">COM</b><small id="p2Inv">木0 石0 砂0</small></div></div></section>
<section class="game-shell"><div class="board-shell" id="boardShell"><div class="map-actions"><button id="overviewBtn" class="map-btn" aria-label="全体マップ">🗺️</button></div><div class="camera-label" id="cameraLabel">📍 PLAYER 1</div><div class="tech-strip"><div class="tech-chip" id="techFire">🔥<small>2🪵1🪨</small></div><div class="tech-chip" id="techBoat">🛶<small>4🪵+🔥</small></div><div class="tech-chip" id="techGoal">⭐</div></div><div id="board" class="board"></div><div id="toast" class="toast"></div><div class="bottom-hud"><button id="diceBtn" class="board-die" aria-label="サイコロを振る"><span class="dice-cube"><span id="diceValue" class="dice-number">-</span></span></button><div class="mission-hud"><span>MISSION</span><strong id="missionNow">🔥 火を起こせ</strong><small id="missionNeed">木 2　石 1</small></div></div><div class="pan-hint">地図をドラッグ</div></div></section></main>
<dialog id="winDialog"><div class="clear-box"><p class="eyebrow">CIVILIZATION WIN</p><div class="clear-icon">🏆🌍✨</div><h2 id="winnerText">PLAYER 1 勝利！</h2><p>自然を越えて、新しい文明の土地へ到達した。</p><button id="playAgain">もう一度</button></div></dialog>
<script src="game.js?v=20260816-8"></script><script>(()=>{const die=document.getElementById('diceBtn'),value=document.getElementById('diceValue'),mission=document.getElementById('missionNow'),need=document.getElementById('missionNeed'),fire=document.getElementById('techFire'),boat=document.getElementById('techBoat'),turn=document.getElementById('turnText');if(!die)return;let timer;function rollVisual(){die.classList.remove('rolling','landed');void die.offsetWidth;die.classList.add('rolling');clearTimeout(timer);timer=setTimeout(()=>{die.classList.remove('rolling');die.classList.add('landed');},760)}die.addEventListener('pointerdown',()=>{if(!die.disabled)rollVisual()},{passive:true});function missionSync(){if(!fire.classList.contains('done')){mission.textContent='🔥 火を起こせ';need.textContent='木 2　石 1'}else if(!boat.classList.contains('done')){mission.textContent='🛶 舟をつくれ';need.textContent='木 4'}else{mission.textContent='⭐ 海の向こうへ';need.textContent='離島を見つけろ'}}const ob=new MutationObserver(missionSync);ob.observe(fire,{attributes:true});ob.observe(boat,{attributes:true});ob.observe(turn,{childList:true,subtree:true});new MutationObserver(()=>{if(/^[1-6]$/.test(value.textContent.trim())&&!die.classList.contains('rolling'))die.classList.add('landed')}).observe(value,{childList:true,characterData:true,subtree:true});missionSync()})();</script></body></html>
